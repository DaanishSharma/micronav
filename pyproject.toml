[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "micronav"
version = "0.0.1"
description = "Sensor fusion and navigation from scratch: IMU, compass, GPS, Kalman filters and map matching in plain numpy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Daanish Sharma" }]
keywords = ["sensor fusion", "kalman filter", "imu", "gps", "navigation", "map matching", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
live = ["opencv-python>=4.6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/daanishsharma/micronav"

[tool.hatch.build.targets.wheel]
packages = ["src/micronav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
