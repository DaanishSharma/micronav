# Publishes to PyPI when you push a version tag, e.g. `git tag v0.1.0 && git push --tags`.
# Uses PyPI trusted publishing: no token is stored in GitHub.
# One-time setup on pypi.org: add a "pending publisher" for project micronav,
# owner daanishsharma, repo micronav, workflow publish.yml, environment pypi.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
